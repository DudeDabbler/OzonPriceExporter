name: CI

on:
  push:
    branches: [main, "migration/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ozon_price_exporter/portable_build_requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tools/ozon_price_exporter/portable_build_requirements.txt
      - name: Focused regression suite
        run: python -m pytest -q tests/test_ozon_price_exporter.py tests/test_ozon_price_exporter_portable.py
      - name: Compile
        run: python -m compileall -q tools/ozon_price_exporter
